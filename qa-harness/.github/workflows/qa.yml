name: QA

# 현재 이 저장소의 워크플로는 이슈 자동배정/자동종료뿐이다.
# lint 도 typecheck 도 PR 에서 안 돈다. husky 는 로컬 훅이라 --no-verify 한 번이면 끝난다.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: 타입 · 린트 · 포맷
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 타입 체크
        run: npx tsc --noEmit
      - name: 린트
        run: npm run lint
      - name: 포맷
        run: npm run format:check

  unit:
    name: 단위 · 통합 (${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # datetime.ts 함수 12개가 전부 로컬 타임존 의존이다. 양쪽에서 돌린다.
        tz: [Asia/Seoul, UTC]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Jest
        env:
          TZ: ${{ matrix.tz }}
        run: npm test -- --ci --coverage --maxWorkers=2

  release-guard:
    name: 릴리스 가드
    runs-on: ubuntu-latest
    # production 빌드 직전에 반드시. 지금 상태로 빌드하면 실행 즉시 크래시한다.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 환경변수 · 모킹 스위치 검증
        run: npm test -- tests/env-guard.test.ts --ci
      - name: .env 가 커밋되지 않았는지 확인
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env 가 저장소에 커밋되어 있습니다."
            exit 1
          fi
      - name: .env.example 존재 확인
        run: test -f .env.example || (echo "::error::.env.example 이 없어 클린 클론으로 앱을 켤 수 없습니다." && exit 1)
