# 참가자 기기: 호스트 평가 → 마이페이지 반영 확인
appId: com.runspot.app
---
- tapOn:
    id: "mypage-tab"
- tapOn:
    text: "${SESSION_TITLE}"
- assertVisible:
    id: "host-rating-root"
    timeout: 10000
- tapOn:
    id: "host-rating-positive"
- tapOn:
    id: "rating-submit"

- tapOn:
    id: "mypage-tab"
- tapOn:
    id: "mypage-recent-runs"
- assertVisible:
    text: "${SESSION_TITLE}"

# 같은 세션을 두 번 평가할 수 없어야 한다
- tapOn:
    text: "${SESSION_TITLE}"
- assertNotVisible:
    id: "rating-submit"
